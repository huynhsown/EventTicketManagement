spring:
  application:
    name: ticket

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  rabbitmq:
    host: mustang.rmq.cloudamqp.com
    port: 5671
    username: fuidxbmu
    password: xTde7JPzm3AThdAeXaBMfxkRLQtPEA_I
    virtual-host: fuidxbmu
    ssl:
      enabled: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

keycloak:
  serverUrl: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  admin:
    realm: ${KEYCLOAK_ADMIN_REALM:master}
    clientId: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  app:
    realm: ${KEYCLOAK_APP_REALM:event-ticket}
    clientId: ${KEYCLOAK_APP_CLIENT_ID:event-ticket-app}
    clientSecret: ${KEYCLOAK_APP_CLIENT_SECRET:ndnm7CiigWjGySZLFGMRHJbWeH27JrTgVFXfh5w0ED1vy07BS1wxIoiQtSeC7yHdOvzZrKYiUCWOx7H566iIEx}
    roles:
      user: USER
      admin: ADMIN

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8090

event:
  max-categories-per-event: 10
  auto-create-inventory: true

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: event-service

  prometheus:
    metrics:
      export:
        enabled: true