spring:
  application:
    name: ticket

  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_db
    username: ticket_user
    password: ticket_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

keycloak:
  serverUrl: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  admin:
    realm: ${KEYCLOAK_ADMIN_REALM:master}
    clientId: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  app:
    realm: ${KEYCLOAK_APP_REALM:event-ticket}
    clientId: ${KEYCLOAK_APP_CLIENT_ID:event-ticket-app}
    clientSecret: ${KEYCLOAK_APP_CLIENT_SECRET:O1tucNY6Eta3eFPLzkA8TmlgAVrWlwWLOn0qlxDg4IkFBM5WQeZXQAtwzYL4OqmOWfW2mTGpiBPP75KFHBZeDY}
    roles:
      user: USER
      admin: ADMIN

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8090

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG